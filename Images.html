<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographie</title>
    <style>
      
        .search-container {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }

        .search-container input {
            width: 300px;
            padding: 0.5rem;
            margin-right: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-container button {
            padding: 0.5rem 1rem;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #0056b3;
        }

        .category-container {
            text-align: center;
            margin: 1rem 0;
        }

        .category-btn {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .category-btn:hover {
            background-color: #0056b3;
        }

        #images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }

        .image-container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .image-container img, .image-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .image-container:hover img, .image-container:hover video {
            transform: scale(1.05);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .image-container:hover .overlay {
            opacity: 1;
        }

        .overlay a {
            color: white;
            margin: 0 0.5rem;
            font-size: 1.5rem;
            text-decoration: none;
        }

        #pagination {
            text-align: center;
            margin: 2rem 0;
        }

        #pagination button {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #pagination button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="Images.css">
</head>
<body>
    <div class="containerone">
        <header class="header">
            <nav>
                <div class="main">
                    <div class="left">
                        <h1>Photographie</h1>
                    </div>
                    <div class="mid">
                        <span class="nav-link"><a href="main.html">Home</a></span>
                        <span class="nav-link"><a href="Images.html">Images</a></span>
                        <span class="nav-link"><a href="AddOn.html">AddOn</a></span>
                        <button type="button" class="button login-btn"><a href="Login.html">Login</a></button>
                        <button type="button" class="button signup-btn"><a href="Signup.html">Signup</a></button>
                    </div>
                    <div class="right ico">
                        <a href="https://twitter.com" target="_blank"><i class="bx bxl-twitter circle-icon"></i></a>
                        <a href="https://linkedin.com" target="_blank"><i class="bx bxl-linkedin circle-icon"></i></a>
                        <a href="https://youtube.com" target="_blank"><i class="bx bxl-youtube circle-icon"></i></a>
                        <a href="https://instagram.com" target="_blank"><i class="bx bxl-instagram circle-icon"></i></a>
                    </div>
                </div>
            </nav>
        </header>
        <div class="text">
            <div class="ptext">
                <p>Images Gallery</p>
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchQuery" placeholder="Search for images or videos">
        <button id="searchBtn"><i class="fa fa-search"></i></button>
    </div>

    <div class="category-container">
        <button class="category-btn" data-category="photos">Photos</button>
        <button class="category-btn" data-category="videos">Videos</button>
    </div>

    <div id="images" class="masonry-grid"></div>

    <div id="pagination">
        <button id="prevPageBtn" disabled><i class="fa fa-chevron-left"></i> Previous</button>
        <button id="nextPageBtn">Next <i class="fa fa-chevron-right"></i></button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const apiKey = 'IaoFVZD6rKoxYIAjHab0F9Wuken7S5sUkyzf4lDD1hPU6ekOj4AQSMQQ';

            let currentPage = 1;
            let currentCategory = 'photos';

            const searchBtn = document.getElementById('searchBtn');
            const searchQuery = document.getElementById('searchQuery');
            const imagesContainer = document.getElementById('images');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const categoryBtns = document.querySelectorAll('.category-btn');

            searchBtn.addEventListener('click', () => {
                currentPage = 1;
                fetchMedia();
            });

            categoryBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentCategory = e.target.dataset.category;
                    currentPage = 1;
                    fetchMedia();
                });
            });

            prevPageBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchMedia();
                }
            });

            nextPageBtn.addEventListener('click', () => {
                currentPage++;
                fetchMedia();
            });

            function fetchMedia() {
                const query = searchQuery.value;
                let url = `https://api.pexels.com/v1/search?query=${query}&page=${currentPage}&per_page=10`;

                if (currentCategory === 'videos') {
                    url = `https://api.pexels.com/videos/search?query=${query}&page=${currentPage}&per_page=10`;
                }

                fetch(url, {
                    headers: {
                        Authorization: apiKey
                    }
                })
                .then(response => response.json())
                .then(data => {
                    displayMedia(data);
                    updatePagination(data);
                })
                .catch(error => console.error('Error fetching media:', error));
            }

            function displayMedia(data) {
                imagesContainer.innerHTML = '';

                const items = currentCategory === 'photos' ? data.photos : data.videos;

                items.forEach(item => {
                    const mediaSrc = currentCategory === 'photos' ? item.src.medium : item.video_files[0].link;
                    const mediaElement = currentCategory === 'photos' ? document.createElement('img') : document.createElement('video');
                    mediaElement.src = mediaSrc;
                    if (currentCategory === 'videos') {
                        mediaElement.controls = true;
                    }

                    const overlay = document.createElement('div');
                    overlay.classList.add('overlay');
                    const openLink = document.createElement('a');
                    openLink.href = mediaSrc;
                    openLink.target = '_blank';
                    openLink.innerHTML = '<i class="fa fa-external-link"></i>';
                    const downloadLink = document.createElement('a');
                    downloadLink.href = mediaSrc;
                    downloadLink.download = '';
                    downloadLink.innerHTML = '<i class="fa fa-download"></i>';
                    overlay.appendChild(openLink);
                    overlay.appendChild(downloadLink);

                    const mediaContainer = document.createElement('div');
                    mediaContainer.classList.add('image-container');
                    mediaContainer.appendChild(mediaElement);
                    mediaContainer.appendChild(overlay);
                    imagesContainer.appendChild(mediaContainer);
                });
            }

            function updatePagination(data) {
                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = data.page >= data.total_pages;
            }

            fetchMedia();
        });
    </script>
</body>
</html>
